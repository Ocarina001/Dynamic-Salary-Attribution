# =============================================================================
# specific_skills.yaml
# 具体工具 / 领域技能词表 + 29 个岗位的核心技能种子
# 唯一读取方：Module_A_PathSearch/build_specific_skills.py（SPEC -> SKILL_ALIASES / JOB_SEEDS）
#
# 用途:
#   1) 从 O*NET software_skills.csv 的工具名中匹配具体技能，生成 onet/job_skills_specific.csv
#   2) 从中文培养方案 onet/bylu_curricula/*.txt 中匹配专业侧具体技能，生成
#      onet/major_skills_specific.csv 和 onet/major_skill_map_specific.txt
#   3) 下游：build_unified_specific.py 合并技能表 + 建岗位相似度 -> path_search.py 建图寻路
#
# ---- 这个文件是怎么来的（设计背景，先读这段） ----
#   不是 O*NET 官方清单，也不是外部标准词表，而是为“专业 -> 岗位匹配”手工设计的
#   规范化技能词表：把 29 个岗位的工具/技术 + 44 个专业培养方案的课程词汇 + 岗位
#   职能常识，统一成同一套规范技能名（如 Python / SQL / Statistics / Compensation），
#   这样中文专业侧和英文 O*NET 岗位侧才能按同名技能对齐。
#
#   三个构造原料：
#     a) O*NET 工具/技术名：英文别名多与 software_skills.csv 的 Workplace Example 同名
#     b) 培养方案课程词汇：191 条中文别名里约 74% 在 44 份培养方案文本中逐字出现
#        （如「数据库原理」「数理统计」「同声传译」）
#     c) 岗位职能/领域常识：O*NET 工具列与课程文本都没有的概念
#        （如 Compensation / Benefits / Labor Law / Financial Modeling）
#
#   设计动机（见 reports/skill_upgrade_report.md）：
#     旧版只有 O*NET 35 项通用能力 + 5 项领域技能，skill_gap 挤在 0.39~0.55、
#     标准差仅 0.03，推荐被微小差异带偏；换成具体技能后区分度约翻倍
#     （std 0.030 -> 0.061，范围 0.163 -> 0.281）。
#
#   规模现状（当前数据实测，仅作说明，代码不读取这些数字）：
#     - 140 个技能、430 条别名（平均 3.1 条/技能，最多 16 条）、34 个 category
#     - 109 个技能进入岗位技能表（其中 87 个有真实 O*NET 工具证据、84 个被种子引用）
#     - 80 个技能在培养方案文本中命中（专业侧）
#     - 12 个技能目前在任何输出中都未命中（前瞻性预留，非同义词写错也非数据错误）：
#       Brand Management, Copywriting, Google Cloud, Jupyter, MLflow, Premiere,
#       PyTorch, SEM/Google Ads, SuccessFactors, TensorFlow, TypeScript, scikit-learn
#
# ---- 字段与匹配规则 ----
#   - 技能名（键）：全项目统一标识，会写入下游 CSV / 建图节点；改名必须重跑管道
#   - category：仅供人阅读的领域标签（代码完全不读），不是 O*NET 官方分类
#   - aliases：实际参与文本匹配的别名；全部小写，中文别名直接写中文
#       纯英文单词 -> 按 \b 词边界正则匹配（如 java 不会误命中 javascript）
#       含空格/符号/中文 -> 按子串出现次数统计（如 "pl/sql"、"c++"、"数据库"）
#   - 别名设计有防御性：C 只用中文别名（避免裸字母 c 满屏误命中），
#     R 用 r语言/rstudio/tidyverse（避免裸字母 r），SQL 收录 snowflake/redshift 等产品名
#   - 已知别名重叠（同一段文本会同时给两个技能记分，多为刻意）：
#     jupyter（Python/Jupyter）、snowflake（SQL/Snowflake）、
#     跨文化交际（Communication/Cross-Cultural Communication）
#
# ---- 维护铁律 ----
#   1) 新增/改名技能后必须依次重跑：build_specific_skills.py -> build_unified_specific.py
#      -> path_search.py --export，否则词典与下游 CSV 不一致
#   2) aliases 保持小写；job_seed 里只能写 skills 中存在的规范名
#   3) category 不影响计算，只是整理标签；本词表不等于专家验证的职业技能标准
#
# ---- 词表排列（大致按领域分段，便于查找） ----
#   ① 通用编程与工程（Python → Kubernetes）
#   ② 云 / 安全 / 网络（AWS → Routing/Switching）
#   ③ 大数据与数据工程（Spark → NoSQL）
#   ④ AI / 数据分析 / BI / 统计软件（Machine Learning → Jupyter）
#   ⑤ 金融 / ERP / 管理与运营（Financial Analysis → Minitab）
#   ⑥ HR / 教育 / 软技能（HRIS → Leadership）
#   ⑦ 营销（Marketing → Brand Management）
#   ⑧ 语言 / 人文 / 研究 / 政策 / 设计（Translation → Photography）
# =============================================================================

# 规范技能词表：键 = 全项目统一技能名；category = 仅供人读的领域标签（代码不读）；
