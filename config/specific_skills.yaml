# -----------------------------------------------------------------------------
# 岗位种子：29 个目标岗位（与 config.yaml 的 jobs 显示名一一对应）的核心技能。
# 作用：O*NET 工具证据在各岗位间分布不均（技术岗工具多、HR/管理岗工具少），
#       种子作为“保底核心技能”，强制权重 4.0（高于任何工具证据算出的 2~4），
#       截断时永不丢弃。每岗位 6~12 个。
# 计算规则（build_specific_skills.py 的 build_job_specific）：
#   - 工具证据权重：raw = 1.0*hot_count + 0.3*cold_count
#                   w   = 2.0 + 2.0*raw/(raw+4.0)   -> [2, 4) 饱和曲线
#   - 与种子 4.0 取 max；整体截断为每岗位最多 30 个技能
# 注意：这里只能写 skills 段中存在的规范名，否则该技能只会以种子身份出现、
#       永远不会参与文本匹配。
# -----------------------------------------------------------------------------
